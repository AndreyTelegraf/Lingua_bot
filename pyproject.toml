[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lingua-bot-v2"
version = "0.1.0"
description = "LinguaBot v2"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.15,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "aiosqlite>=0.20,<1",
  "structlog>=24.4,<25",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools]
packages = ["app", "bot", "modes", "domain", "db"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
